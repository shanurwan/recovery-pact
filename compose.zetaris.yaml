# Overlay for live Zetaris federation. Use through scripts/zetaris-setup.sh:
#
#   docker compose -f compose.yaml -f compose.zetaris.yaml up -d
#
# Networking is done by the script, not here: Compose would register the service
# names "api" and "postgres" on any network it declares, and the Zetaris stack uses
# exactly those hostnames for its own services. The script attaches containers to
# the rp-bridge network by container name only.
services:
  api:
    environment:
      ZETARIS_ENABLED: "true"
      ZETARIS_URL: ${ZETARIS_URL:-http://zetaris-ui-1:3000}
