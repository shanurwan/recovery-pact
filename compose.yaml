name: recovery-pact

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: checkout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/init-continuity.sql:/docker-entrypoint-initdb.d/02-continuity.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkout && psql -U postgres -lqt | grep -q continuity"]
      interval: 3s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://checkout:checkout@postgres:5432/checkout
      OBSERVER_DATABASE_URL: postgresql+psycopg://observer:observer@postgres:5432/checkout
      EXECUTOR_DATABASE_URL: postgresql+psycopg://remediator:remediator@postgres:5432/checkout
      UNRESTRICTED_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/checkout
      CONTINUITY_DATABASE_URL: postgresql+psycopg://observer:observer@postgres:5432/continuity
      HMEM_PERSIST_DIR: /app/data/hmem
      RUNS_DIR: /app/data/runs
      RECORD_DIR: /app/data/recordings
      RECORDINGS_DIR: /app/recordings
      CHANGE_CALENDAR_CSV: /app/seed/business/change_calendar.csv
      INFERENCE_MODE: ${INFERENCE_MODE:-nemotron}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./seed:/app/seed:ro
      - ./recordings:/app/recordings:ro
      - ./evals:/app/evals
      - ./tests:/app/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "${UI_PORT:-8080}:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  traffic:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.services.traffic_generator"]
    environment:
      CHECKOUT_URL: http://api:8000
      TRAFFIC_RPS: ${TRAFFIC_RPS:-4}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
