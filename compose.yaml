services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: checkout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkout"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://checkout:checkout@postgres:5432/checkout
      OBSERVER_DATABASE_URL: postgresql+psycopg://observer:observer@postgres:5432/checkout
      EXECUTOR_DATABASE_URL: postgresql+psycopg://remediator:remediator@postgres:5432/checkout
      HMEM_PERSIST_DIR: /app/data/hmem
      INFERENCE_MODE: ${INFERENCE_MODE:-fixture}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  traffic:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.services.traffic_generator"]
    environment:
      CHECKOUT_URL: http://api:8000
      TRAFFIC_RPS: ${TRAFFIC_RPS:-2}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
